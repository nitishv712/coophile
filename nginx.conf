
upstream coophile {
    # Matches the published port in compose.yaml (PORT, default 3000). The
    # container binds 0.0.0.0 inside, but only ever needs to be reachable from
    # this machine — do not publish it on a public interface as well.
    server 127.0.0.1:3000;

    # Reuse connections instead of paying a TCP handshake per request. Needs
    # the HTTP/1.1 + empty Connection header set below to take effect.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name coophile.talkmos.com;

    # Left reachable over plain http so webroot renewals keep working after
    # certbot has added the redirect above this block.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # `always` so these survive on error responses too. Note that adding an
    # add_header inside a location would discard every one of these, so keep
    # response headers here.
    #
    # HSTS over plain http is inert rather than wrong: certbot edits this same
    # server block in place, so the header starts being honoured the moment TLS
    # lands on it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Small by default. The one endpoint that legitimately receives a large
    # body raises it for itself, below.
    client_max_body_size 1m;

    # Inherited by every location. A location that sets any proxy_set_header of
    # its own would drop all of these, so the locations below deliberately set
    # none.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The lobby builds invite links from the Host header, so it has to be the
    # name the guest will actually open — not the upstream's.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;

    # ROM uploads. The app rejects anything over 64 MB itself, so this only
    # needs headroom for multipart framing — nginx's 1 MB default would turn
    # every real upload into a 413 before the app ever saw it.
    location ~ ^/api/admin/games/[^/]+/rom$ {
        client_max_body_size 72m;
        # Stream it through rather than spooling the whole file to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://coophile;
    }

    # ROM downloads: tens of megabytes streamed out of GridFS, and both players
    # fetch one at the start of a netplay session.
    location ~ ^/api/games/[^/]+/rom$ {
        proxy_read_timeout 300s;
        proxy_pass http://coophile;
    }
    location /_next/static/ {
        proxy_pass http://coophile;
    }

    location / {
        proxy_pass http://coophile;
    }
}
